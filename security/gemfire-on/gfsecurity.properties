# Chunk 10: security ON. Mounted at /security on every member by compose.security.yaml.
# (Kept out of gemfire.properties so the same member commands work with security on or off.)

# ── 10a: who may do what ─────────────────────────────────────────────────────
# GemFire ships this example SecurityManager in gemfire-core. It reads users, passwords and roles from
# a JSON file on the CLASSPATH (members start with --classpath=/security, so ./security.json here).
# Plain-text passwords: fine for a lab, never for anything real (write your own SecurityManager
# against LDAP, an IdP, a vault, ...).
security-manager=org.apache.geode.examples.security.ExampleSecurityManager
security-json=security.json

# A member is a client of the cluster too: to JOIN, it logs in like anyone else and needs CLUSTER:MANAGE.
# These are the credentials the locator and servers present to each other.
security-username=cluster
security-password=cluster

# ── 10c: TLS on the members' HTTP service (Management REST, /metrics, the developer REST API) ───
# Only "web": peer-to-peer, client/server and locator traffic stay plaintext in this lab (that's
# ssl-enabled-components=cluster,server,locator: every client and member then needs the truststore).
# Key + certificates come from the one-shot `certs` service (security/certs/make-certs.sh).
ssl-enabled-components=web
ssl-keystore=/certs/lab.p12
ssl-keystore-password=changeit
ssl-keystore-type=pkcs12
ssl-truststore=/certs/truststore.p12
ssl-truststore-password=changeit
ssl-truststore-type=pkcs12

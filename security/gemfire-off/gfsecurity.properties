# Chunk 10: security OFF (the default). Every GemFire member starts with
#   --security-properties-file=/security/gfsecurity.properties --classpath=/security
# and compose.yaml mounts THIS folder at /security, so the file is empty: no SecurityManager,
# anyone can read and change the cluster.
#
# compose.security.yaml mounts ../gemfire-on at /security instead. Switch it on with one line in .env:
#   COMPOSE_FILE=compose.yaml:compose.security.yaml
# then `make stop && make start` (all members must switch together: see docs/10-security.md).

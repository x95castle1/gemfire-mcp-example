# Chunk 8: what Prometheus scrapes. UI: http://localhost:19090 (Status -> Targets shows each one UP/DOWN)
global:
  scrape_interval: 15s      # matches gemfire.prometheus.metrics.interval=15s in compose.yaml
  evaluation_interval: 15s

# The gemfire job lives in its own file: chunk 10's compose.security.yaml mounts an https version of
# this folder (security/prometheus/scrape.d) in its place.
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  # The Spring Boot workload (chunk 5): JVM + our workload_* counters
  - job_name: workload
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["workload:8090"]

  # SeaweedFS (the S3 telemetry store): -metricsPort=9327 in compose.yaml
  - job_name: seaweedfs
    static_configs:
      - targets: ["seaweedfs:9327"]

  # The SRE assistant (chunk 9): our sre_* metrics (questions, tool calls) + Spring AI's gen_ai_* (tokens, latency).
  # DOWN when the assistant isn't running (make sre), which is fine.
  - job_name: sre-assistant
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sre-assistant:8080"]

  # The observability stack watching itself
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

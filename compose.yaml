name: gfmcp

# ─────────────────────────────────────────────────────────────────────────────
# GemFire MCP learning lab.
#   Chunk 1: cluster = locator + 3 servers + one-shot region init (no profile, always on)
#   Later chunks add profile-gated services: mcp, telemetry, workload, inspector, s3, assistant
#
# Every member writes its .log and .gfs into ./data/gemfire/<member>/ (bind-mounted at
# /var/gemfire), so you can see the files on your laptop and so one telemetry forwarder
# (chunk 3) can scan them all.
# ─────────────────────────────────────────────────────────────────────────────

# Notes for every member command below (YAML `>` blocks cannot hold comments):
#   --J=-XX:-UseZGC --J=-XX:+UseG1GC  gfsh adds ZGC by default; we switch to G1 so GC stats look familiar.
#   --properties-file                 shared stats/log settings the MCP server depends on (see gemfire/gemfire.properties).
x-gemfire: &gemfire
  image: ${GEMFIRE_IMAGE:-gemfire/gemfire:10.3.4-jdk17}
  environment:
    ACCEPT_TERMS: "y"
  volumes:
    - ./data/gemfire:/var/gemfire
    - ./gemfire:/config:ro
  networks: [gfmcp]

x-server: &server
  <<: *gemfire
  # No auto-restart: chaos scripts (chunk 6) kill servers on purpose and we want them to stay dead
  restart: "no"
  depends_on:
    locator:
      condition: service_healthy
  healthcheck:
    # Cache server port accepting connections = cache is up and regions are created
    test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/40404"]
    interval: 5s
    timeout: 3s
    start_period: 60s
    retries: 30

# The ONE contract between the forwarder (writes) and the MCP server (reads): the same store.
# Chunk 7: an S3 bucket on SeaweedFS. /gfmcp is this cluster's prefix: one prefix per cluster,
# because nothing stops two clusters sharing a location from mixing their data.
x-telemetry-store: &telemetry-store
  GF_TELEMETRY_STORE: s3://gemfire-telemetry/gfmcp
  # Any S3-compatible store: setting an endpoint also switches to path-style URLs (http://seaweedfs:8333/<bucket>/...)
  GF_S3_ENDPOINT: http://seaweedfs:8333
  GF_S3_ACCESS_KEY: admin
  GF_S3_SECRET_KEY: admin

services:

  locator:
    <<: *gemfire
    hostname: locator
    # The image's entrypoint runs the member in the foreground in the CURRENT directory,
    # so working_dir is what decides where locator.log / locator.gfs land.
    working_dir: /var/gemfire/locator
    restart: on-failure
    command: >
      gfsh start locator
        --name=locator
        --port=10334
        --hostname-for-clients=locator
        --properties-file=/config/gemfire.properties
        --J=-Dgemfire.statistic-archive-file=locator.gfs
        --initial-heap=512m --max-heap=512m
        --J=-XX:-UseZGC --J=-XX:+UseG1GC
        --enable-cluster-configuration=true
        --http-service-port=7070
        --J=-Dgemfire.enable-management-rest-service=true
        --J=-Dgemfire.jmx-manager-hostname-for-clients=locator
    ports:
      # Management REST API (what the MCP server talks to). Host port 17070 avoids gemfire-runner's 7070.
      - "17070:7070"
    healthcheck:
      # The same check the MCP docs use: GET /management/v1/ping -> "pong" (bash /dev/tcp; the image has no curl)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7070 && printf 'GET /management/v1/ping HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q pong <&3"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  server-1:
    <<: *server
    hostname: server-1
    working_dir: /var/gemfire/server-1
    command: >
      gfsh start server
        --name=server-1
        --locators=locator[10334]
        --server-port=40404
        --hostname-for-clients=server-1
        --properties-file=/config/gemfire.properties
        --J=-Dgemfire.statistic-archive-file=server-1.gfs
        --initial-heap=768m --max-heap=768m
        --J=-XX:-UseZGC --J=-XX:+UseG1GC
        --eviction-heap-percentage=75
        --critical-heap-percentage=90

  server-2:
    <<: *server
    hostname: server-2
    working_dir: /var/gemfire/server-2
    command: >
      gfsh start server
        --name=server-2
        --locators=locator[10334]
        --server-port=40404
        --hostname-for-clients=server-2
        --properties-file=/config/gemfire.properties
        --J=-Dgemfire.statistic-archive-file=server-2.gfs
        --initial-heap=768m --max-heap=768m
        --J=-XX:-UseZGC --J=-XX:+UseG1GC
        --eviction-heap-percentage=75
        --critical-heap-percentage=90

  server-3:
    <<: *server
    hostname: server-3
    working_dir: /var/gemfire/server-3
    command: >
      gfsh start server
        --name=server-3
        --locators=locator[10334]
        --server-port=40404
        --hostname-for-clients=server-3
        --properties-file=/config/gemfire.properties
        --J=-Dgemfire.statistic-archive-file=server-3.gfs
        --initial-heap=768m --max-heap=768m
        --J=-XX:-UseZGC --J=-XX:+UseG1GC
        --eviction-heap-percentage=75
        --critical-heap-percentage=90

  # One-shot: creates the demo regions (stored in cluster config), then exits 0.
  gemfire-init:
    <<: *gemfire
    restart: "no"
    working_dir: /tmp
    depends_on:
      server-1: { condition: service_healthy }
      server-2: { condition: service_healthy }
      server-3: { condition: service_healthy }
    command: gfsh run --file=/config/init-cluster.gfsh

  # ── Chunk 2: the GemFire MCP server ──────────────────────────────────────────
  # docker compose --profile mcp up -d --build
  #
  # Two data sources, two settings:
  #   GF_MCP_GEMFIRE_URL  -> live state (list_members, list_regions, assess_cluster_health, ...)
  #   GF_TELEMETRY_STORE  -> history (stats + logs). Required even while empty: the server refuses to
  #                          start if it can't reach the store; an empty store only logs a warning.
  # Careful: an UNKNOWN GF_MCP_* variable (e.g. a typo) makes the server refuse to start.
  mcp-server:
    profiles: [mcp]
    build:
      context: .
      dockerfile: docker/mcp-server/Dockerfile
      args:
        GF_MCP_VERSION: ${GF_MCP_VERSION:-1.0.0}
    image: gfmcp/gemfire-mcp-server:${GF_MCP_VERSION:-1.0.0}
    hostname: mcp-server
    depends_on:
      locator: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    environment:
      <<: *telemetry-store
      # Default is 127.0.0.1 (loopback), which inside a container means unreachable from outside.
      SERVER_ADDRESS: 0.0.0.0
      # The locator's Management REST API. The server appends /management/v1 itself.
      GF_MCP_GEMFIRE_URL: http://locator:7070
      # Front-door auth for MCP clients (mode=basic is the default). Both are required.
      GF_MCP_AUTH_BASIC_USERNAME: ${GF_MCP_AUTH_BASIC_USERNAME:?set it in .env}
      GF_MCP_AUTH_BASIC_PASSWORD: ${GF_MCP_AUTH_BASIC_PASSWORD:?set it in .env}
      # Lab only: otherwise 50 bad logins lock out your laptop's IP for a few minutes.
      GF_MCP_AUTH_FAILURE_LIMIT_ENABLED: "false"
    ports:
      - "8085:8085"
    healthcheck:
      # Any HTTP answer (even 401 without credentials) means Tomcat is up and serving /mcp
      test: ["CMD", "curl", "-so", "/dev/null", "http://127.0.0.1:8085/mcp"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [gfmcp]

  # ── Chunk 3: the telemetry forwarder ────────────────────────────────────────
  # docker compose --profile telemetry up -d --build telemetry-forwarder
  #
  # Every 10s: scan /var/gemfire for member files and copy new or changed ones into the store.
  #   <member>.gfs        live stats archive -> re-shipped whenever it changes
  #   <member>-NN-NN.gfs  rolled archive     -> shipped once
  #   <member>.log        live log           -> shipped from the start, then followed as it grows
  # It recognizes members by file CONTENT (archive header / the log's "Startup Configuration" block),
  # so meta-*.log and pulse.log are skipped on purpose.
  #
  # It never talks to the MCP server. The contract between them is just: the same GF_TELEMETRY_STORE.
  telemetry-forwarder:
    profiles: [telemetry]
    build:
      context: .
      dockerfile: docker/telemetry-forwarder/Dockerfile
      args:
        GF_MCP_VERSION: ${GF_MCP_VERSION:-1.0.0}
    image: gfmcp/gemfire-telemetry-forwarder:${GF_MCP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      locator: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    environment:
      <<: *telemetry-store
      # The folder holding the members' working directories (scanned up to 5 levels deep)
      GF_TELEMETRY_FORWARDER_SCAN_DIR: /var/gemfire
      GF_TELEMETRY_FORWARDER_INTERVAL: "10"
    volumes:
      # read-write: the forwarder creates /var/gemfire/.forwarder.lock (one forwarder per folder)
      - ./data/gemfire:/var/gemfire
    networks: [gfmcp]

  # ── Chunk 4: MCP Inspector, the official MCP debugging UI ─────────────────────
  # make inspector  ->  http://localhost:6274
  # Started already pointed at our MCP server (with the admin/admin Basic header), so the
  # Tools / Resources / History tabs work without typing anything into the UI.
  inspector:
    profiles: [inspector]
    image: ghcr.io/modelcontextprotocol/inspector:2.16.0
    command:
      - --web
      - --transport
      - http
      - --server-url
      - http://mcp-server:8085/mcp
      - --header
      - "Authorization: Basic YWRtaW46YWRtaW4="
    environment:
      # No OS keychain in a container; say so explicitly instead of getting a warning at startup
      MCP_INSPECTOR_SECRET_STORE: memory
    ports:
      - "6274:6274"   # web UI (needs the per-start token: make inspector reads it from the log)
      - "6275:6275"   # sandbox (renders MCP App UIs; unused by GemFire's tools)
      - "6278:6278"   # MCP App origin
    networks: [gfmcp]

  # ── Chunk 7: S3 telemetry store on SeaweedFS ─────────────────────────────────
  # One container = master + volume server + filer + S3 gateway.
  #   http://localhost:8333  S3 API            (user admin / secret admin, see seaweedfs/s3.json)
  #   http://localhost:8888  filer file browser -> make seaweed
  seaweedfs:
    profiles: [telemetry, mcp]
    image: chrislusf/seaweedfs:4.55
    hostname: seaweedfs
    restart: unless-stopped
    # The image's entrypoint turns on 1 GB preallocated volumes; flags given later win, so switch that off
    command: >
      server -s3 -filer
        -s3.config=/etc/seaweedfs/s3.json
        -master.volumePreallocate=false
        -master.volumeSizeLimitMB=64
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - ./data/seaweedfs:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # S3 gateway's own health endpoint. (Not the filer's "/": that renders an HTML listing, and a
      # probe that hangs up early makes the filer log "Template Execute Error ... broken pipe".)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [gfmcp]

  # One-shot: create the bucket if it isn't there yet (the forwarder doesn't create buckets).
  s3-init:
    profiles: [telemetry, mcp]
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket gemfire-telemetry 2>/dev/null
        && echo "bucket gemfire-telemetry exists"
        || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://gemfire-telemetry
    networks: [gfmcp]

networks:
  gfmcp:
    name: gfmcp

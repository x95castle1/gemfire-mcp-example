name: gfmcp

# ─────────────────────────────────────────────────────────────────────────────
# GemFire MCP learning lab.
#   Chunk 1: cluster = locator + 3 servers + one-shot region init (no profile, always on)
#   Later chunks add profile-gated services: mcp, telemetry, workload, inspector, s3, assistant
#
# Every member writes its .log and .gfs into ./data/gemfire/<member>/ (bind-mounted at
# /var/gemfire), so you can see the files on your laptop and so one telemetry forwarder
# (chunk 3) can scan them all.
# ─────────────────────────────────────────────────────────────────────────────

# Every GemFire member below repeats the same image / environment / volumes / network on purpose:
# each service reads top to bottom with nothing hidden in a shared YAML anchor.
#
# Notes for every member command (YAML `>` blocks cannot hold comments):
#   --J=-XX:-UseZGC --J=-XX:+UseG1GC  gfsh adds ZGC by default; we switch to G1 so GC stats look familiar.
#   --properties-file                 shared stats/log settings the MCP server depends on (see gemfire/gemfire.properties).
#   working_dir                       the image's entrypoint runs the member in the foreground in the CURRENT
#                                     directory, so working_dir decides where <member>.log / <member>.gfs land.
#   prometheus.metrics.*              (chunk 8) GemFire's built-in Prometheus endpoint: GET :7070/metrics on the
#                                     member's HTTP service. Off ("None") by default; "Default" = a curated set.
#                                     Its default interval is 1m, too coarse for dashboards, so 15s.
#   --http-service-port/bind-address  (chunk 8) servers don't run an HTTP service unless told to; /metrics needs
#                                     one. The bind address also stops "No host/bind address specified: Using
#                                     localhost" being logged twice on every Management REST call about the member.
#   --start-rest-api=true             (chunk 8) GemFire only starts a SERVER's /metrics endpoint when its developer
#                                     REST API (/gemfire-api) is on too (found in GemFireCacheImpl.startMetricsApi).

services:

  locator:
    image: ${GEMFIRE_IMAGE:-gemfire/gemfire:10.3.4-jdk17}
    environment:
      ACCEPT_TERMS: "y"
    volumes:
      - ./data/gemfire:/var/gemfire
      - ./gemfire:/config:ro
    networks: [gfmcp]
    hostname: locator
    working_dir: /var/gemfire/locator
    restart: on-failure
    command: >
      gfsh start locator
        --name=locator
        --port=10334
        --hostname-for-clients=locator
        --properties-file=/config/gemfire.properties
        --J=-Dgemfire.statistic-archive-file=locator.gfs
        --initial-heap=512m --max-heap=512m
        --J=-XX:-UseZGC --J=-XX:+UseG1GC
        --enable-cluster-configuration=true
        --http-service-port=7070
        --http-service-bind-address=locator
        --J=-Dgemfire.prometheus.metrics.emission=Default
        --J=-Dgemfire.prometheus.metrics.interval=15s
        --J=-Dgemfire.enable-management-rest-service=true
        --J=-Dgemfire.jmx-manager-hostname-for-clients=locator
    ports:
      # Management REST API (what the MCP server talks to). Host port 17070 avoids gemfire-runner's 7070.
      - "17070:7070"
    healthcheck:
      # The same check the MCP docs use: GET /management/v1/ping -> "pong" (bash /dev/tcp; the image has no curl).
      # To "locator", not 127.0.0.1: with --http-service-bind-address the HTTP service no longer listens on loopback.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/locator/7070 && printf 'GET /management/v1/ping HTTP/1.0\\r\\nHost: locator\\r\\n\\r\\n' >&3 && grep -q pong <&3"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  server-1:
    image: ${GEMFIRE_IMAGE:-gemfire/gemfire:10.3.4-jdk17}
    environment:
      ACCEPT_TERMS: "y"
    volumes:
      - ./data/gemfire:/var/gemfire
      - ./gemfire:/config:ro
    networks: [gfmcp]
    # No auto-restart: chaos scripts (chunk 6) kill servers on purpose and we want them to stay dead
    restart: "no"
    depends_on:
      locator: { condition: service_healthy }
    healthcheck:
      # Ask the locator's Management REST API whether this member (hostname = member name) has its
      # cache server running ("cacheServerInfo":[{..."running":true}]), the last thing a member starts.
      # Not "status":"online": after an auto-reconnect (chunk 6, pause) GemFire leaves the status at
      # "starting" for good, although the member is fully back.
      # Not a raw connect to the cache-server port 40404: a probe that opens it and hangs up without
      # speaking GemFire's protocol makes the server log "failed accepting client connection
      # java.io.EOFException" every 5s, noise that ends up in the logs the MCP server searches.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/locator/7070 && printf 'GET /management/v1/members/%s HTTP/1.0\\r\\nHost: locator\\r\\n\\r\\n' \"$$(hostname)\" >&3 && grep -q '\"running\":true' <&3"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30
    hostname: server-1
    working_dir: /var/gemfire/server-1
    command: >
      gfsh start server
        --name=server-1
        --locators=locator[10334]
        --server-port=40404
        --hostname-for-clients=server-1
        --properties-file=/config/gemfire.properties
        --J=-Dgemfire.statistic-archive-file=server-1.gfs
        --initial-heap=768m --max-heap=768m
        --J=-XX:-UseZGC --J=-XX:+UseG1GC
        --eviction-heap-percentage=75
        --critical-heap-percentage=90
        --http-service-port=7070
        --http-service-bind-address=server-1
        --start-rest-api=true
        --J=-Dgemfire.prometheus.metrics.emission=Default
        --J=-Dgemfire.prometheus.metrics.interval=15s

  server-2:
    image: ${GEMFIRE_IMAGE:-gemfire/gemfire:10.3.4-jdk17}
    environment:
      ACCEPT_TERMS: "y"
    volumes:
      - ./data/gemfire:/var/gemfire
      - ./gemfire:/config:ro
    networks: [gfmcp]
    restart: "no"
    depends_on:
      locator: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/locator/7070 && printf 'GET /management/v1/members/%s HTTP/1.0\\r\\nHost: locator\\r\\n\\r\\n' \"$$(hostname)\" >&3 && grep -q '\"running\":true' <&3"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30
    hostname: server-2
    working_dir: /var/gemfire/server-2
    command: >
      gfsh start server
        --name=server-2
        --locators=locator[10334]
        --server-port=40404
        --hostname-for-clients=server-2
        --properties-file=/config/gemfire.properties
        --J=-Dgemfire.statistic-archive-file=server-2.gfs
        --initial-heap=768m --max-heap=768m
        --J=-XX:-UseZGC --J=-XX:+UseG1GC
        --eviction-heap-percentage=75
        --critical-heap-percentage=90
        --http-service-port=7070
        --http-service-bind-address=server-2
        --start-rest-api=true
        --J=-Dgemfire.prometheus.metrics.emission=Default
        --J=-Dgemfire.prometheus.metrics.interval=15s

  server-3:
    image: ${GEMFIRE_IMAGE:-gemfire/gemfire:10.3.4-jdk17}
    environment:
      ACCEPT_TERMS: "y"
    volumes:
      - ./data/gemfire:/var/gemfire
      - ./gemfire:/config:ro
    networks: [gfmcp]
    restart: "no"
    depends_on:
      locator: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/locator/7070 && printf 'GET /management/v1/members/%s HTTP/1.0\\r\\nHost: locator\\r\\n\\r\\n' \"$$(hostname)\" >&3 && grep -q '\"running\":true' <&3"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30
    hostname: server-3
    working_dir: /var/gemfire/server-3
    command: >
      gfsh start server
        --name=server-3
        --locators=locator[10334]
        --server-port=40404
        --hostname-for-clients=server-3
        --properties-file=/config/gemfire.properties
        --J=-Dgemfire.statistic-archive-file=server-3.gfs
        --initial-heap=768m --max-heap=768m
        --J=-XX:-UseZGC --J=-XX:+UseG1GC
        --eviction-heap-percentage=75
        --critical-heap-percentage=90
        --http-service-port=7070
        --http-service-bind-address=server-3
        --start-rest-api=true
        --J=-Dgemfire.prometheus.metrics.emission=Default
        --J=-Dgemfire.prometheus.metrics.interval=15s

  # One-shot: creates the demo regions (stored in cluster config), then exits 0.
  gemfire-init:
    image: ${GEMFIRE_IMAGE:-gemfire/gemfire:10.3.4-jdk17}
    environment:
      ACCEPT_TERMS: "y"
    volumes:
      - ./data/gemfire:/var/gemfire
      - ./gemfire:/config:ro
    networks: [gfmcp]
    restart: "no"
    working_dir: /tmp
    depends_on:
      server-1: { condition: service_healthy }
      server-2: { condition: service_healthy }
      server-3: { condition: service_healthy }
    command: gfsh run --file=/config/init-cluster.gfsh

  # ── Chunk 2: the GemFire MCP server ──────────────────────────────────────────
  # docker compose --profile mcp up -d --build
  #
  # Two data sources, two settings:
  #   GF_MCP_GEMFIRE_URL  -> live state (list_members, list_regions, assess_cluster_health, ...)
  #   GF_TELEMETRY_STORE  -> history (stats + logs). Required even while empty: the server refuses to
  #                          start if it can't reach the store; an empty store only logs a warning.
  # Careful: an UNKNOWN GF_MCP_* variable (e.g. a typo) makes the server refuse to start.
  mcp-server:
    profiles: [mcp]
    build:
      context: .
      dockerfile: docker/mcp-server/Dockerfile
      args:
        GF_MCP_VERSION: ${GF_MCP_VERSION:-1.0.0}
    image: gfmcp/gemfire-mcp-server:${GF_MCP_VERSION:-1.0.0}
    hostname: mcp-server
    depends_on:
      locator: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    environment:
      # The ONE contract between the forwarder (writes) and the MCP server (reads): the same store.
      # An S3 bucket on SeaweedFS (chunk 7). /gfmcp is this cluster's prefix: one prefix per cluster,
      # because nothing stops two clusters sharing a location from mixing their data.
      GF_TELEMETRY_STORE: s3://gemfire-telemetry/gfmcp
      # Any S3-compatible store: setting an endpoint also switches to path-style URLs (http://seaweedfs:8333/<bucket>/...)
      GF_S3_ENDPOINT: http://seaweedfs:8333
      GF_S3_ACCESS_KEY: admin
      GF_S3_SECRET_KEY: admin
      # Default is 127.0.0.1 (loopback), which inside a container means unreachable from outside.
      SERVER_ADDRESS: 0.0.0.0
      # The locator's Management REST API. The server appends /management/v1 itself.
      GF_MCP_GEMFIRE_URL: http://locator:7070
      # Front-door auth for MCP clients (mode=basic is the default). Both are required.
      GF_MCP_AUTH_BASIC_USERNAME: ${GF_MCP_AUTH_BASIC_USERNAME:?set it in .env}
      GF_MCP_AUTH_BASIC_PASSWORD: ${GF_MCP_AUTH_BASIC_PASSWORD:?set it in .env}
      # Lab only: otherwise 50 bad logins lock out your laptop's IP for a few minutes.
      GF_MCP_AUTH_FAILURE_LIMIT_ENABLED: "false"
    ports:
      - "8085:8085"
    healthcheck:
      # Any HTTP answer (even 401 without credentials) means Tomcat is up and serving /mcp
      test: ["CMD", "curl", "-so", "/dev/null", "http://127.0.0.1:8085/mcp"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [gfmcp]

  # ── Chunk 3: the telemetry forwarder ────────────────────────────────────────
  # docker compose --profile telemetry up -d --build telemetry-forwarder
  #
  # Every 10s: scan /var/gemfire for member files and copy new or changed ones into the store.
  #   <member>.gfs        live stats archive -> re-shipped whenever it changes
  #   <member>-NN-NN.gfs  rolled archive     -> shipped once
  #   <member>.log        live log           -> shipped from the start, then followed as it grows
  # It recognizes members by file CONTENT (archive header / the log's "Startup Configuration" block),
  # so meta-*.log and pulse.log are skipped on purpose.
  #
  # It never talks to the MCP server. The contract between them is just: the same GF_TELEMETRY_STORE.
  telemetry-forwarder:
    profiles: [telemetry]
    build:
      context: .
      dockerfile: docker/telemetry-forwarder/Dockerfile
      args:
        GF_MCP_VERSION: ${GF_MCP_VERSION:-1.0.0}
    image: gfmcp/gemfire-telemetry-forwarder:${GF_MCP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      locator: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    environment:
      # Must match mcp-server's store settings exactly: same bucket, same prefix, same credentials.
      GF_TELEMETRY_STORE: s3://gemfire-telemetry/gfmcp
      GF_S3_ENDPOINT: http://seaweedfs:8333
      GF_S3_ACCESS_KEY: admin
      GF_S3_SECRET_KEY: admin
      # The folder holding the members' working directories (scanned up to 5 levels deep)
      GF_TELEMETRY_FORWARDER_SCAN_DIR: /var/gemfire
      GF_TELEMETRY_FORWARDER_INTERVAL: "10"
    volumes:
      # read-write: the forwarder creates /var/gemfire/.forwarder.lock (one forwarder per folder)
      - ./data/gemfire:/var/gemfire
    networks: [gfmcp]

  # ── Chunk 5: workload generator (Spring Boot 4.1 GemFire client) ─────────────
  # make load  ->  pick a scenario (steady, burst, hot-key, heap-hog, release-heap, stop)
  # Control API on http://localhost:18090 (/status, /scenarios, POST /scenario/{name})
  # (host port 18090: gemfire-runner's goodbye-world already owns 8090)
  workload:
    profiles: [workload]
    build:
      context: workload
      # Broadcom Artifactory credentials for the Gradle build, from .env, passed as BuildKit secrets
      secrets: [artifactory_username, artifactory_password]
    image: gfmcp/workload:dev
    depends_on:
      gemfire-init: { condition: service_completed_successfully }   # regions must exist first
    environment:
      WORKLOAD_SCENARIO: steady
    ports:
      - "18090:8090"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8090/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    networks: [gfmcp]

  # ── Chunk 4: MCP Inspector, the official MCP debugging UI ─────────────────────
  # make inspector  ->  http://localhost:6274
  # Started already pointed at our MCP server (with the admin/admin Basic header), so the
  # Tools / Resources / History tabs work without typing anything into the UI.
  inspector:
    profiles: [inspector]
    image: ghcr.io/modelcontextprotocol/inspector:2.16.0
    command:
      - --web
      - --transport
      - http
      - --server-url
      - http://mcp-server:8085/mcp
      - --header
      - "Authorization: Basic YWRtaW46YWRtaW4="
    environment:
      # No OS keychain in a container; say so explicitly instead of getting a warning at startup
      MCP_INSPECTOR_SECRET_STORE: memory
    ports:
      - "6274:6274"   # web UI (needs the per-start token: make inspector reads it from the log)
      - "6275:6275"   # sandbox (renders MCP App UIs; unused by GemFire's tools)
      - "6278:6278"   # MCP App origin
    networks: [gfmcp]

  # ── Chunk 7: S3 telemetry store on SeaweedFS ─────────────────────────────────
  # One container = master + volume server + filer + S3 gateway.
  #   http://localhost:8333  S3 API            (user admin / secret admin, see seaweedfs/s3.json)
  #   http://localhost:8888  filer file browser -> make seaweed
  seaweedfs:
    profiles: [telemetry, mcp]
    image: chrislusf/seaweedfs:4.55
    hostname: seaweedfs
    restart: unless-stopped
    # The image's entrypoint turns on 1 GB preallocated volumes; flags given later win, so switch that off
    # -metricsPort=9327: Prometheus metrics for chunk 8 (observability)
    command: >
      server -s3 -filer
        -s3.config=/etc/seaweedfs/s3.json
        -master.volumePreallocate=false
        -master.volumeSizeLimitMB=64
        -metricsPort=9327
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - ./data/seaweedfs:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # S3 gateway's own health endpoint. (Not the filer's "/": that renders an HTML listing, and a
      # probe that hangs up early makes the filer log "Template Execute Error ... broken pipe".)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [gfmcp]

  # One-shot: create the bucket if it isn't there yet (the forwarder doesn't create buckets).
  s3-init:
    profiles: [telemetry, mcp]
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket gemfire-telemetry 2>/dev/null
        && echo "bucket gemfire-telemetry exists"
        || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://gemfire-telemetry
    networks: [gfmcp]

  # ── Chunk 9: SRE assistant, our own MCP client (make sre) ────────────────────
  # http://localhost:18080 : ask a question, pick Claude or Qwen, watch every tool call and JSON-RPC
  # message live. Claude needs ANTHROPIC_API_KEY in .env; Qwen needs Ollama running on your Mac
  # (outside Docker), reached through host.docker.internal.
  sre-assistant:
    profiles: [assistant]
    build:
      context: sre-assistant
    image: gfmcp/sre-assistant:dev
    depends_on:
      mcp-server: { condition: service_healthy }
    environment:
      GF_MCP_URL: http://mcp-server:8085
      GF_MCP_AUTH_BASIC_USERNAME: ${GF_MCP_AUTH_BASIC_USERNAME:-admin}
      GF_MCP_AUTH_BASIC_PASSWORD: ${GF_MCP_AUTH_BASIC_PASSWORD:-admin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
    extra_hosts:
      # Docker Desktop already knows host.docker.internal; this makes it work on Linux too
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:8080"    # host port 18080: gemfire-runner owns 8080
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    networks: [gfmcp]

  # ── Chunk 8: observability (make grafana-ui) ─────────────────────────────────
  # Metrics: Prometheus scrapes GemFire (:7070/metrics/), SeaweedFS, the workload.
  # Logs:    Alloy ships container stdout + GemFire's log files + data/chaos.log into Loki.
  # The MCP server and the forwarder have NO metrics endpoint: their numbers come from their log lines.
  #   Grafana     http://localhost:13000  (no login)
  #   Prometheus  http://localhost:19090
  #   Alloy       http://localhost:12345  (the log pipeline, drawn as a graph)
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    # The image runs as "nobody"; root here so it can write to the bind-mounted ./data/prometheus
    user: root
    ports:
      - "19090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [gfmcp]

  loki:
    profiles: [observability]
    image: grafana/loki:3.6.22
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./data/loki:/loki
    # The image runs as uid 10001; root here so it can write to the bind-mounted ./data/loki
    user: root
    ports:
      - "13100:3100"
    # No healthcheck: the image is distroless (no shell, no wget/curl). Check it from your laptop:
    #   curl localhost:13100/ready
    networks: [gfmcp]

  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data     # remembers how far it read each file/container
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # to discover containers and read their logs
      - ./data:/lab-data:ro                             # GemFire log files + chaos.log
      - ./data/alloy:/var/lib/alloy/data
    depends_on:
      loki: { condition: service_started }
    ports:
      - "12345:12345"
    networks: [gfmcp]

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    environment:
      # No login (lab only): anonymous visitors are Admins, so you can also edit dashboards, and the
      # login form is hidden.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gfmcp-lab.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_started }
    ports:
      - "13000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [gfmcp]

networks:
  gfmcp:
    name: gfmcp

# Build-time secrets (only used by `workload`'s Dockerfile, never stored in the image)
secrets:
  artifactory_username:
    environment: GEMFIRE_ARTIFACTORY_USERNAME
  artifactory_password:
    environment: GEMFIRE_ARTIFACTORY_PASSWORD

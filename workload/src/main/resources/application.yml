server:
  port: 8090

spring:
  application:
    name: workload
  data:
    gemfire:
      name: workload
      # How the client finds the cluster: ask the locator, which hands out the servers
      pool:
        locators: locator[10334]

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus   # /actuator/prometheus feeds chunk 10 (observability)

workload:
  # Scenario at startup; change it at runtime with `make load` (POST /scenario/{name})
  scenario: ${WORKLOAD_SCENARIO:steady}

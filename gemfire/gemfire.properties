# Shared by every member (locator + servers) via --properties-file.
#
# Everything here exists so the GemFire MCP server has HISTORY to read.
# The telemetry forwarder ships these files to the telemetry store:
#   <member>.gfs  -> statistics history  (query_stat, find_stat_threshold_crossings, ...)
#   <member>.log  -> log history         (search_logs, get_membership_timeline, ...)

# --- Statistics archive (.gfs) ---
statistic-sampling-enabled=true
# Sample every 1s, so short spikes are visible
statistic-sample-rate=1000
# Needed for the put_latency signal
enable-time-statistics=true
# Roll the archive at 10 MB and keep at most 200 MB per member.
# The forwarder re-uploads a LIVE archive each time it changes but uploads ROLLED archives once,
# so small rolling files keep each upload cycle cheap.
archive-file-size-limit=10
archive-disk-space-limit=200

# --- Logs (.log) ---
log-level=config
log-file-size-limit=10
log-disk-space-limit=200
